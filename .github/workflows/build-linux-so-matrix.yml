name: Build Native Binaries Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-glibc:
    name: glibc-${{ matrix.rid }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            cc: gcc
            cflags: -Wall -O2 -pthread -fPIC
            x86_64: "1"
            packages: ""
          - rid: linux-x86
            cc: gcc -m32
            cflags: -Wall -O2 -pthread -fPIC -m32
            x86_64: "0"
            packages: gcc-multilib libc6-dev-i386
          - rid: linux-arm64
            cc: aarch64-linux-gnu-gcc
            cflags: -Wall -O2 -pthread -fPIC
            x86_64: "0"
            packages: gcc-aarch64-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cross toolchains
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Build shared library
        run: |
          make clean
          make \
            CC="${{ matrix.cc }}" \
            CFLAGS="${{ matrix.cflags }}" \
            x86_64=${{ matrix.x86_64 }}

      - name: Prepare RID layout
        run: |
          set -e
          out="dist/${{ matrix.rid }}/runtimes/${{ matrix.rid }}/native"
          mkdir -p "$out"

          cp libuf-lzma2.so.1.0 "$out/libuf-lzma2.so.1.0"
          ln -sf libuf-lzma2.so.1.0 "$out/libuf-lzma2.so.1"
          ln -sf libuf-lzma2.so.1.0 "$out/libuf-lzma2.so"

          mkdir -p "dist/${{ matrix.rid }}/include"
          cp uf-lzma2.h uf2_errors.h "dist/${{ matrix.rid }}/include/"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uf-lzma2-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}
          if-no-files-found: error

  build-windows:
    name: windows-${{ matrix.rid }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-x86
            platform: Win32

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build DLL (MSVC)
        run: |
          msbuild dll/uf-lzma2.vcxproj /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:OutDir="${{ github.workspace }}\out\${{ matrix.rid }}\" /p:IntDir="${{ github.workspace }}\obj\${{ matrix.rid }}\"
        shell: pwsh

      - name: Prepare RID layout
        run: |
          $out = "dist/${{ matrix.rid }}/runtimes/${{ matrix.rid }}/native"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "out/${{ matrix.rid }}/uf-lzma2.dll" "$out/uf-lzma2.dll" -Force

          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.rid }}/include" | Out-Null
          Copy-Item "uf-lzma2.h" "dist/${{ matrix.rid }}/include/uf-lzma2.h" -Force
          Copy-Item "uf2_errors.h" "dist/${{ matrix.rid }}/include/uf2_errors.h" -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uf-lzma2-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}
          if-no-files-found: error

  package-all-artifacts:
    name: package-all-artifacts
    runs-on: ubuntu-24.04
    needs:
      - build-linux-glibc
      - build-windows

    steps:
      - name: Download all per-RID artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: uf-lzma2-*
          path: merged
          merge-multiple: true

      - name: Create single zip bundle
        run: |
          cd merged
          zip -r ../uf-lzma2-all-rids.zip .

      - name: Upload single bundle
        uses: actions/upload-artifact@v7
        with:
          name: uf-lzma2-all-rids
          path: uf-lzma2-all-rids.zip
          if-no-files-found: error